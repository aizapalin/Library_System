{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Define Category | Sylvan Library</title>
    <link rel="stylesheet" href="{% static 'book_management/css/Category_style.css' %}">
</head>

<body>
    <div class="category-card">
        <h2>Define New Category</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <label for="id_name">Category Name</label>
            <input type="text" id="id_name" name="name" placeholder="Enter category..." required>
            
            <button type="submit">
                Add to Archives
            </button>
        </form>

        <div class="management-zone">
            <label class="section-label">Recorded Categories</label>
            <form method="POST">
                {% csrf_token %}
                <select name="category_id" required>
                    <option value="" disabled selected>-- Select a Category --</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
                <button type="submit" name="delete_category" class="burn-category-btn">Delete Category</button>
            </form>
        </div>
        
        <p class="back-navigation">
            <a href="{% url 'book_management:add_book' %}">← Back to Consignment</a>
        </p>
    </div>
</body>
</html>
