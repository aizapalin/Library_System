{% extends 'base.html' %}

{% block content %}
<div class="management-zone members-page-center">
    <h2>Register a Patron</h2>
    <div class="subtitle">Add a Patron to the Archives</div>

    <div class="form-container" style="margin: 0 auto;">
        <form method="POST" action="">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="submit-btn" style="margin-top: 20px;">Enroll Scholar</button>
        </form>
    </div>

    <div class="back-link">
        <a href="{% url 'members:index' %}">← Return to Registry</a>
    </div>
</div>
{% endblock %}
